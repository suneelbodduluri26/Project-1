<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Contact Hello, World!"><title>Contact | Hello, World!</title>
  <style>
    :root{color-scheme:dark;--ink:#f7f7ff;--muted:#c7c7df;--cyan:#54e4ff}*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:2rem;display:grid;place-items:center;color:var(--ink);font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 10% 90%,#713cff 0,transparent 32rem),radial-gradient(circle at 88% 5%,#007f96 0,transparent 29rem),#10101f}main{width:min(100%,850px);padding:clamp(2rem,7vw,5rem);border:1px solid #ffffff2e;border-radius:28px;background:#1b1b35bd;box-shadow:0 30px 90px #00000061;backdrop-filter:blur(20px);animation:rise .8s ease both}nav{display:flex;flex-wrap:wrap;gap:.55rem;margin-bottom:3.5rem}nav a{display:inline-block;padding:.6rem .95rem;border-radius:999px;color:var(--muted);font-weight:750;text-decoration:none;background:#ffffff14;transition:.18s}nav a:hover,nav a[aria-current=page]{color:#131324;background:linear-gradient(100deg,var(--cyan),#d7c8ff);transform:translateY(-2px)}.eyebrow{margin:0 0 1rem;color:var(--cyan);font-weight:800;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font-size:clamp(3rem,9vw,6rem);line-height:.98;letter-spacing:-.065em}.intro{max-width:37rem;margin:1.4rem 0 2.2rem;color:var(--muted);font-size:1.16rem;line-height:1.75}form{display:grid;gap:1rem;max-width:610px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:1rem}label{display:grid;gap:.45rem;color:var(--muted);font-size:.9rem;font-weight:700}input,textarea{width:100%;padding:.85rem 1rem;border:1px solid #ffffff29;border-radius:12px;color:var(--ink);font:inherit;background:#0606186e}input:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:2px}textarea{min-height:8rem;resize:vertical}button{justify-self:start;border:0;padding:.85rem 1.2rem;border-radius:999px;color:#131324;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(100deg,var(--cyan),#d7c8ff)}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:600px){body{padding:1rem}.fields{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <nav aria-label="Primary navigation"><a href="hello-world.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
  <p class="eyebrow">Let’s make something</p><h1>Say hello.</h1><p class="intro">Have an idea, question, or just want to share a good thought? Leave a note below. This demo form is ready for your future form handler.</p>
  <form action="#" method="post"><div class="fields"><label>Your name<input name="name" type="text" autocomplete="name" placeholder="Ada Lovelace" required></label><label>Email address<input name="email" type="email" autocomplete="email" placeholder="ada@example.com" required></label></div><label>Your message<textarea name="message" placeholder="Tell us what is on your mind..." required></textarea></label><button type="submit">Send message &rarr;</button></form>
</main></body></html>
