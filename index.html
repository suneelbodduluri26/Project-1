<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A polished Hello, World! page." />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f7f7ff;
        --muted: #c7c7df;
        --violet: #9a7cff;
        --cyan: #54e4ff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10101f;
      }

      body::before,
      body::after {
        position: fixed;
        width: 38rem;
        height: 38rem;
        border-radius: 50%;
        content: "";
        filter: blur(20px);
        opacity: 0.5;
        pointer-events: none;
      }

      body::before {
        top: -17rem;
        left: -13rem;
        background: #713cff;
      }

      body::after {
        right: -16rem;
        bottom: -18rem;
        background: #00bfd8;
      }

      main {
        width: min(92%, 760px);
        padding: clamp(2.5rem, 8vw, 5.5rem);
        text-align: center;
        background: rgba(27, 27, 53, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 28px;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(20px);
        animation: rise 900ms cubic-bezier(.2,.8,.2,1) both;
      }

      nav {
        display: flex;
        justify-content: center;
        gap: 0.55rem;
        margin-bottom: 3.25rem;
      }

      nav a {
        padding: 0.55rem 0.9rem;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: none;
      }

      nav a[aria-current="page"], nav a:hover { color: #131324; background: linear-gradient(100deg, var(--cyan), #d7c8ff); }

      .eyebrow {
        display: inline-flex;
        gap: 0.5rem;
        align-items: center;
        margin: 0 0 1.2rem;
        color: var(--cyan);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 18px currentColor;
        content: "";
      }

      h1 {
        margin: 0;
        font-size: clamp(3.4rem, 12vw, 7rem);
        line-height: 0.95;
        letter-spacing: -0.07em;
        background: linear-gradient(115deg, #fff 20%, var(--cyan) 52%, var(--violet) 82%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 33rem;
        margin: 1.6rem auto 2.3rem;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.7;
      }

      a {
        display: inline-block;
        padding: 0.85rem 1.2rem;
        border-radius: 999px;
        color: #131324;
        font-weight: 800;
        text-decoration: none;
        background: linear-gradient(100deg, var(--cyan), #d7c8ff);
        box-shadow: 0 10px 26px rgba(84, 228, 255, 0.25);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      a:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(84, 228, 255, 0.38); }
      a:focus-visible { outline: 3px solid white; outline-offset: 4px; }

      @keyframes rise {
        from { opacity: 0; transform: translateY(18px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Primary navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="eyebrow">A friendly beginning</div>
      <h1>Hello, World!</h1>
      <p>Your next great idea has a home. This small page is styled, responsive, and ready for you to make it your own.</p>
      <a href="#hello" id="hello">Start creating →</a>
    </main>
  </body>
</html>
