ound:linear-gradient(145deg,#714ce8,#ba8cff)}.tile:nth-child(5){grid-column:span 2;background:linear-gradient(145deg,#00a9cf,#054c91)}.tile:nth-child(6){background:linear-gradient(145deg,#ec6a95,#f9b364)}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:650px){body{padding:1rem}.grid{grid-template-columns:1fr 1fr;grid-auto-rows:130px}.tile:nth-child(5){grid-column:span 1}.tile:nth-child(1){grid-row:span 1}}
